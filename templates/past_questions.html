{% extends "base.html" %}
{% block title %}Past Questions{% endblock %}
{% block content %}

<div class="app">
  <header class="header">
    <div class="header-brand">
      <a href="{{ url_for('home') }}" class="icon-btn" aria-label="Back">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2.2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="m15 18-6-6 6-6"/>
        </svg>
      </a>
      <div class="header-brand-text">
        <div class="header-brand-name">Past Questions</div>
        <div class="header-brand-sub">Search, upload, download</div>
      </div>
    </div>
    <button class="icon-btn" id="pqUploadBtn" aria-label="Upload">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2.2"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 5v14M5 12h14"/>
      </svg>
    </button>
  </header>

  <!-- Filters -->
  <div class="market-search-wrap">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2.2"
         stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
    </svg>
    <input type="text" id="pqCourse" placeholder="Course code — e.g. CSC 301" autocomplete="off">
  </div>

  <div class="chips" style="padding: 6px 14px 10px;">
    <select class="chip" id="pqLevel">
      <option value="">All levels</option>
      <option value="100">100</option>
      <option value="200">200</option>
      <option value="300">300</option>
      <option value="400">400</option>
      <option value="500">500</option>
    </select>
    <select class="chip" id="pqYear">
      <option value="">All years</option>
      {% for y in range(2026, 2012, -1) %}
        <option value="{{ y }}">{{ y }}</option>
      {% endfor %}
    </select>
  </div>

  <div class="section-label" id="pqCount" style="padding: 4px 18px 8px;"></div>
  <div id="pqList" class="assign-list">
    <div class="empty">Loading…</div>
  </div>
</div>

<!-- Upload modal -->
<div class="modal-back" id="pqModal">
  <div class="modal">
    <div class="modal-head">
      <button class="modal-close" id="pqModalClose">✕</button>
      <div class="modal-title">Upload Past Question</div>
      <div class="modal-head-spacer"></div>
    </div>

    <div class="grid-2">
      <div class="field">
        <label>Course code *</label>
        <input type="text" id="upCode" placeholder="CSC 301" maxlength="20">
      </div>
      <div class="field">
        <label>Year *</label>
        <select id="upYear">
          {% for y in range(2026, 2012, -1) %}
            <option value="{{ y }}">{{ y }}</option>
          {% endfor %}
        </select>
      </div>
    </div>

    <div class="field">
      <label>Course title</label>
      <input type="text" id="upTitle" placeholder="Data Structures" maxlength="120">
    </div>

    <div class="grid-2">
      <div class="field">
        <label>Level *</label>
        <select id="upLevel">
          <option value="100">100</option>
          <option value="200">200</option>
          <option value="300">300</option>
          <option value="400">400</option>
          <option value="500">500</option>
        </select>
      </div>
      <div class="field">
        <label>Semester</label>
        <select id="upSem">
          <option value="">—</option>
          <option value="first">First</option>
          <option value="second">Second</option>
        </select>
      </div>
    </div>

    <div class="field">
      <label>Department</label>
      <input type="text" id="upDept" placeholder="Computer Science" maxlength="80">
    </div>

    <div class="field">
      <label>File (PDF, DOC, DOCX, PNG, JPG) *</label>
      <input type="file" id="upFile" accept=".pdf,.doc,.docx,.png,.jpg,.jpeg,.webp">
    </div>

    <button class="btn btn-primary btn-block" id="pqSubmit">Submit for review</button>
  </div>
</div>

{% endblock %}
{% block scripts %}
<script>
(function () {
  const list   = document.getElementById('pqList');
  const count  = document.getElementById('pqCount');
  const course = document.getElementById('pqCourse');
  const level  = document.getElementById('pqLevel');
  const year   = document.getElementById('pqYear');

  const modal     = document.getElementById('pqModal');
  const openBtn   = document.getElementById('pqUploadBtn');
  const closeBtn  = document.getElementById('pqModalClose');
  const submitBtn = document.getElementById('pqSubmit');

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, m => (
      {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]
    ));
  }
  function fmtSize(n) {
    if (!n) return '';
    if (n < 1024) return n + ' B';
    if (n < 1048576) return (n/1024).toFixed(0) + ' KB';
    return (n/1048576).toFixed(1) + ' MB';
  }

  async function load() {
    const params = new URLSearchParams();
    if (course.value.trim()) params.set('course', course.value.trim());
    if (level.value)         params.set('level',  level.value);
    if (year.value)          params.set('year',   year.value);

    list.innerHTML = '<div class="empty">Loading…</div>';
    try {
      const r = await fetch('/api/past-questions?' + params.toString(),
                            { credentials: 'same-origin' });
      if (!r.ok) throw new Error();
      const rows = await r.json();
      count.textContent = rows.length ? `${rows.length} result${rows.length>1?'s':''}` : '';

      if (!rows.length) {
        list.innerHTML = '<div class="empty">No past questions found.<br>Tap + to upload one.</div>';
        return;
      }

      list.innerHTML = rows.map(p => `
        <div class="assign-item" style="border-left-color: var(--primary);">
          <div class="assign-body">
            <div class="assign-course">${esc(p.course_code)}${p.course_title ? ' · ' + esc(p.course_title) : ''}</div>
            <div class="assign-title">${p.year} — Level ${esc(p.level)}${p.semester ? ' · ' + esc(p.semester) : ''}</div>
            <div class="assign-desc">${esc(p.department || '—')} · ${p.downloads} download${p.downloads!==1?'s':''}</div>
            <div class="assign-due">${esc(p.file_name || 'Past question file')}${p.file_size ? ' · ' + fmtSize(p.file_size) : ''}</div>
            <button class="btn btn-primary btn-sm mt-8" data-dl="${p.id}">Download</button>
          </div>
        </div>
      `).join('');
    } catch (_) {
      list.innerHTML = '<div class="empty">Could not load past questions.</div>';
    }
  }

  list.addEventListener('click', async e => {
    const btn = e.target.closest('[data-dl]');
    if (!btn) return;
    btn.disabled = true;
    try {
      const r = await fetch(`/api/past-questions/${btn.dataset.dl}/download`,
                            { credentials: 'same-origin' });
      if (!r.ok) throw new Error();
      const { url } = await r.json();
      window.open(url, '_blank', 'noopener');
    } catch (_) {
      alert('Download failed.');
    }
    btn.disabled = false;
  });

  let t;
  [course, level, year].forEach(el => el.addEventListener('input', () => {
    clearTimeout(t); t = setTimeout(load, 250);
  }));
  level.addEventListener('change', load);
  year.addEventListener('change', load);

  // Modal
  openBtn.addEventListener('click', () => modal.classList.add('open'));
  closeBtn.addEventListener('click', () => modal.classList.remove('open'));
  modal.addEventListener('click', e => {
    if (e.target === modal) modal.classList.remove('open');
  });

  submitBtn.addEventListener('click', async () => {
    const code  = document.getElementById('upCode').value.trim();
    const lvl   = document.getElementById('upLevel').value;
    const yr    = document.getElementById('upYear').value;
    const title = document.getElementById('upTitle').value.trim();
    const dept  = document.getElementById('upDept').value.trim();
    const sem   = document.getElementById('upSem').value;
    const file  = document.getElementById('upFile').files[0];

    if (!code) return alert('Course code required');
    if (!file) return alert('Please choose a file');

    const fd = new FormData();
    fd.append('course_code', code);
    fd.append('course_title', title);
    fd.append('department', dept);
    fd.append('level', lvl);
    fd.append('semester', sem);
    fd.append('year', yr);
    fd.append('file', file);

    submitBtn.disabled = true;
    submitBtn.textContent = 'Uploading…';
    try {
      const r = await fetch('/api/past-questions', {
        method: 'POST', credentials: 'same-origin', body: fd,
      });
      const data = await r.json();
      if (!r.ok) throw new Error(data.error || 'Upload failed');
      alert('Submitted for review. You will be notified once approved.');
      modal.classList.remove('open');
      ['upCode','upTitle','upDept'].forEach(id => document.getElementById(id).value = '');
      document.getElementById('upFile').value = '';
    } catch (err) {
      alert(err.message || 'Upload failed');
    }
    submitBtn.disabled = false;
    submitBtn.textContent = 'Submit for review';
  });

  load();
})();
</script>
{% endblock %}
