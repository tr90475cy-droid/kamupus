<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Forgot password · KAMUPUS</title>
  <style>
    body{font-family:system-ui,-apple-system,sans-serif;background:#0a0b0c;
         display:flex;min-height:100vh;align-items:center;justify-content:center;margin:0}
    .card{background:#fff;padding:32px;border-radius:14px;max-width:420px;width:100%;
          box-shadow:0 10px 30px rgba(0,0,0,.06)}
    h1{margin:0 0 6px;font-size:22px}
    p.lead{color:#666;margin:0 0 20px;font-size:14px}
    label{display:block;font-size:13px;color:#333;margin:14px 0 6px}
    input{width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;font-size:15px;box-sizing:border-box}
    button{margin-top:18px;width:100%;padding:12px;border:0;border-radius:8px;
           background:#a65c07;color:#fff;font-weight:600;font-size:15px;cursor:pointer}
    button:disabled{opacity:.6;cursor:not-allowed}
    .msg{padding:10px 12px;border-radius:8px;font-size:13px;margin-bottom:14px}
    .msg.error{background:#fde8e8;color:#8a1c1c}
    .msg.success{background:#e6f6ec;color:#166534}
    .msg.info{background:#eef2ff;color:#3730a3}
    .back{display:block;text-align:center;margin-top:16px;font-size:13px;color:#555}
  </style>
</head>
<body>
  <div class="card">
    <h1>Forgot your password?</h1>
    <p class="lead">Enter the email you signed up with and we’ll send a reset link.</p>

    {% with msgs = get_flashed_messages(with_categories=true) %}
      {% for cat, m in msgs %}
        <div class="msg {{ cat }}">{{ m }}</div>
      {% endfor %}
    {% endwith %}

    <form method="post" id="fp-form" autocomplete="off">
      <label for="email">Email address</label>
      <input id="email" name="email" type="email" value="{{ email or '' }}"
             required placeholder="you@example.com" autofocus>
      <button type="submit" id="fp-btn">Send reset link</button>
    </form>

    <a class="back" href="{{ url_for('login') }}">← Back to login</a>
  </div>
  <script>
    document.getElementById('fp-form').addEventListener('submit', function () {
      var b = document.getElementById('fp-btn');
      b.disabled = true;
      b.textContent = 'Sending…';
    });
  </script>
</body>
</html>
